name: Refresh ECJ class listings

on:
  workflow_dispatch:
  schedule:
    # Roughly morning and late afternoon in Los Angeles. GitHub cron uses UTC.
    - cron: "15 0,16 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_classes.py"
      - "scripts/class_terms.json"
      - ".github/workflows/update-classes.yml"

permissions:
  contents: write

jobs:
  refresh-classes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh public ECJ class data
        run: python scripts/update_classes.py

      - name: Commit updated class data
        shell: bash
        run: |
          if git diff --quiet -- data/classes.json; then
            echo "No class-list changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classes.json
          git commit -m "Update ECJ class listings"
          git push
